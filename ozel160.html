  function temaEsle(){
    var l=document.body.classList.contains('light');

  }

    var st=d.getElementById('ozel-sade');if(!st){st=d.createElement('style');st.id='ozel-sade';d.head.appendChild(st)}

  /* 12) Yedekle / Geri yükle: Drive MCP (claude.ai) APK'da yok; yedek dosya olarak üretilir ve paylaşım menüsüyle Drive'a gönderilir.
         Yedek = tüm localStorage (notlar, hızlı not, favoriler, sıralamalar, ayarlar, Kur'an işaretleri). */
  function yedekVeri(){var o={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);o[k]=localStorage.getItem(k)}}catch(e){}return JSON.stringify({cafer_yedek:1,t:new Date().toISOString(),veri:o})}
  function yedekAd(){var d=new Date(),p=function(n){return (n<10?'0':'')+n};return 'cafer-ai-yedek-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json'}
  function bildir(m){try{toast(m)}catch(e){try{alert(m)}catch(x){}}}
  function yedekle(){
    var C=window.Capacitor,ad=yedekAd(),veri=yedekVeri();
    if(C&&C.nativePromise&&C.isNativePlatform&&C.isNativePlatform()){
      C.nativePromise('Filesystem','writeFile',{path:ad,data:veri,directory:'CACHE',encoding:'utf8'})
